name: pagatu-kafka-dev

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: pagatu-kafka-dev
    restart: unless-stopped
    ports:
      - "19092:19092"
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "4L622n22Q6qyoRw0UyEoDC"
    networks:
      - pagatu-kafka-dev-net

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: pagatu-kafka-ui-dev
    restart: unless-stopped
    ports:
      - "18085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pagatu-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - pagatu-kafka-dev-net

networks:
  pagatu-kafka-dev-net:
    name: pagatu-kafka-dev-net
